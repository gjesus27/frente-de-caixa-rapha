<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>
<body>
<div class="layoutAdmin">
  <aside class="sidebarAdmin">
    <h2>Painel</h2>
    <nav>
      <a href="dashboard.html" class="ativo"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a href="pdv.html"><i class="fa-solid fa-cash-register"></i> PDV</a>
      <a href="produtos.html"><i class="fa-solid fa-box"></i> Produtos</a>
      <a href="entregador.html"><i class="fa-solid fa-motorcycle"></i> Entregas</a>
    </nav>
    <button onclick="baixarExcel()" class="sidebarAction">
      <i class="fa-solid fa-file-excel"></i> Relatório Excel
    </button>
    <button id="logout" class="sidebarAction sair">Sair</button>
  </aside>

  <main class="conteudoAdmin">
    <header>
      <h1>Painel Administrativo</h1>
    </header>

    <section class="filtros">
      <input type="date" id="inicio">
      <input type="date" id="fim">
      <button onclick="filtrar()">Filtrar</button>
    </section>

    <section class="cards">
      <div class="card">
        <h3>Total Vendido</h3>
        <p id="totalVendido">R$0</p>
      </div>

      <div class="card">
        <h3>Pedidos</h3>
        <p id="totalPedidos">0</p>
      </div>

      <div class="card">
        <h3>Ticket Médio</h3>
        <p id="ticketMedio">R$0</p>
      </div>

      <div class="card">
        <h3>Ranking de Caixas</h3>
        <div id="rankingCaixas"></div>
      </div>

      <div class="card">
        <h3>Vendas iFood</h3>
        <input id="inputIfood" type="number" placeholder="Digite valor">
        <button onclick="salvarIfood()">Salvar</button>
        <p id="lucroIfood">R$0</p>
      </div>

      <div class="card">
        <h3>Vendas Keeta</h3>
        <input id="inputKeeta" type="number" placeholder="Digite valor">
        <button onclick="salvarKeeta()">Salvar</button>
        <p id="lucroKeeta">R$0</p>
      </div>
    </section>

    <section class="graficos">
      <div class="grafico">
        <h3>Vendas por Dia</h3>
        <canvas id="graficoVendas"></canvas>
      </div>

      <div class="grafico">
        <h3>Produtos Mais Vendidos</h3>
        <canvas id="graficoProdutos"></canvas>
      </div>

      <div class="grafico">
        <h3>PDV vs Delivery</h3>
        <canvas id="graficoPlataforma"></canvas>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { db } from "../js/firebaseConfig.js";
import {
collection,
getDocs,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let grafico1
let grafico2
let grafico3

let lucroIfood = 0
let lucroKeeta = 0

async function carregar(){

let total = 0
let pedidos = 0

let vendasDia = {}
let produtos = {}

let pdv = 0
let delivery = 0

let ranking = {}

lucroIfood = 0
lucroKeeta = 0

const inicio = document.getElementById("inicio").value
const fim = document.getElementById("fim").value


/* 🔥 AGORA BUSCA EM VENDAS */
const snapshot = await getDocs(collection(db,"vendas"))

function parseData(input){
  if(!input) return null

  const [ano, mes, dia] = input.split("-")
  return new Date(ano, mes - 1, dia)
}

const dataInicio = parseData(inicio)
const dataFim = parseData(fim)

snapshot.forEach(doc=>{

const p = doc.data()

if(!p) return

let dataPedido

if(p.criadoEm?.toDate){
  dataPedido = p.criadoEm.toDate()
} else {
  dataPedido = new Date(p.criadoEm)
}

/* FILTRO */

if(dataInicio && dataPedido < dataInicio) return

if(dataFim){
  const fimDoDia = new Date(dataFim)
  fimDoDia.setHours(23,59,59,999)

  if(dataPedido > fimDoDia) return
}

const valor = Number(p.total || 0)

total += valor
pedidos++

const nome = p.nomeUsuario || p.idUsuario || "Sem nome"

ranking[nome] = (ranking[nome] || 0) + valor

if(p.tipo === "pdv") pdv += valor
else delivery += valor


const dia = dataPedido.toLocaleDateString()

vendasDia[dia] = (vendasDia[dia] || 0) + valor


if(p.itens){

p.itens.forEach(i=>{

produtos[i.nome] = (produtos[i.nome] || 0) + Number(i.qtd || 0)

})

}

})


/* IFOOD / KEETA */

const plataformas = await getDocs(collection(db,"plataformas"))

plataformas.forEach(doc=>{

const p = doc.data()

if(p.nome === "ifood") lucroIfood += Number(p.valor || 0)
if(p.nome === "keeta") lucroKeeta += Number(p.valor || 0)

})

document.getElementById("totalVendido").innerText = "R$" + total.toFixed(2)
document.getElementById("totalPedidos").innerText = pedidos
document.getElementById("ticketMedio").innerText = "R$" + (pedidos ? total/pedidos : 0).toFixed(2)
document.getElementById("lucroIfood").innerText = "R$" + lucroIfood.toFixed(2)
document.getElementById("lucroKeeta").innerText = "R$" + lucroKeeta.toFixed(2)

desenharGraficos(vendasDia, produtos, pdv, delivery)
desenharRanking(ranking)
}

window.filtrar = carregar

function desenharRanking(ranking){
const lista = Object.entries(ranking)
.sort((a,b)=> b[1]-a[1])
.slice(0,5)

const div = document.getElementById("rankingCaixas")
div.innerHTML = ""

lista.forEach(([nome,valor])=>{
const p = document.createElement("p")
p.innerText = nome + " - R$" + valor.toFixed(2)
div.appendChild(p)
})
}

function desenharGraficos(vendasDia, produtos, pdv, delivery){
if(grafico1) grafico1.destroy()
if(grafico2) grafico2.destroy()
if(grafico3) grafico3.destroy()

grafico1 = new Chart(document.getElementById("graficoVendas"),{
type:"line",
data:{
labels:Object.keys(vendasDia),
datasets:[{
label:"Vendas",
data:Object.values(vendasDia),
borderColor:"#5e17eb",
backgroundColor:"rgba(94,23,235,0.2)",
fill:true
}]
}
})

grafico2 = new Chart(document.getElementById("graficoProdutos"),{
type:"bar",
data:{
labels:Object.keys(produtos),
datasets:[{
label:"Qtd",
data:Object.values(produtos),
backgroundColor:"#5e17eb"
}]
}
})

grafico3 = new Chart(document.getElementById("graficoPlataforma"),{
type:"doughnut",
data:{
labels:["PDV","Delivery"],
datasets:[{
data:[pdv, delivery],
backgroundColor:["#5e17eb","#00c853"]
}]
}
})
}

window.salvarIfood = async function(){
const v = Number(document.getElementById("inputIfood").value || 0)
if(!v) return
await addDoc(collection(db,"plataformas"),{nome:"ifood",valor:v})
carregar()
}

window.salvarKeeta = async function(){
const v = Number(document.getElementById("inputKeeta").value || 0)
if(!v) return
await addDoc(collection(db,"plataformas"),{nome:"keeta",valor:v})
carregar()
}

window.baixarExcel = function(){
const wb = XLSX.utils.book_new()
const ws = XLSX.utils.json_to_sheet([
{campo:"Total Vendido", valor:document.getElementById("totalVendido").innerText},
{campo:"Pedidos", valor:document.getElementById("totalPedidos").innerText},
{campo:"Ticket Médio", valor:document.getElementById("ticketMedio").innerText},
{campo:"Lucro iFood", valor:document.getElementById("lucroIfood").innerText},
{campo:"Lucro Keeta", valor:document.getElementById("lucroKeeta").innerText}
])
XLSX.utils.book_append_sheet(wb,ws,"Relatorio")
XLSX.writeFile(wb,"relatorio_dashboard.xlsx")
}

document.getElementById("logout").onclick = ()=>{
localStorage.removeItem("usuarioLogado")
window.location.href = "login.html"
}

carregar()
</script>

<script src="../js/sessao.js"></script>
</body>
</html>
