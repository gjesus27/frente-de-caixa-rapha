<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/configuracoes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>
<body>
  <div class="layoutAdmin">
        <aside class="sidebarAdmin"></aside>

    <main class="conteudoAdmin">
      <header class="topoConfiguracoes">
        <div>
          <h1>Configurações</h1>
          <p>Edite seu perfil, usuários, permissões e categorias de produtos.</p>
        </div>
      </header>

      <section class="painelCard">
        <h3>Meu perfil</h3>
        <div class="formGrid">
          <label>Foto (URL)
            <input id="meuFoto" placeholder="https://...">
          </label>
          <label>Nome
            <input id="meuNome" placeholder="Seu nome">
          </label>
          <label>Nova senha
            <input id="minhaSenha" type="password" placeholder="********">
          </label>
        </div>
        <button id="salvarMeuPerfil" class="btnPrimario">Salvar meu perfil</button>
      </section>

      <section class="painelCard" data-admin-area>
        <h3>Categorias pré-definidas</h3>
        <div class="categoriaLinha">
          <input id="novaCategoria" placeholder="Ex.: Açaí, Lanches, Bebidas">
          <button id="adicionarCategoria" class="btnPrimario">Adicionar</button>
        </div>
        <div id="listaCategorias" class="listaSimples"></div>
      </section>

      <section class="painelCard" data-admin-area>
        <h3>Usuários (admin)</h3>
        <div id="listaUsuariosAdmin" class="usuariosAdmin"></div>
      </section>
    </main>
  </div>

  <script type="module">import { exigirLogin, montarSidebar, aplicarUsuarioLogado } from "../js/layout.js"; exigirLogin(); montarSidebar(); aplicarUsuarioLogado();</script>
  <script type="module" src="../js/configuracoes.js"></script>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
