<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/caixa.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>
<body>
  <div class="layoutAdmin">
        <aside class="sidebarAdmin"></aside>

    <main class="conteudoAdmin">
      <header class="topoCaixa">
        <div>
          <h1>Controle de Caixa</h1>
          <p>Abertura, sangria, fechamento e histórico por forma de pagamento.</p>
        </div>
      </header>

      <section class="gridCaixa">
        <article class="painelCard" id="statusCaixa"></article>
        <article class="painelCard" id="resumoPagamentos"></article>
      </section>

      <section class="painelCard" id="historicoFechamentos">
        <h3>Histórico de Fechamentos (Admin)</h3>
        <div id="listaFechamentos"></div>
      </section>
    </main>
  </div>

  <script type="module" src="../js/caixaControle.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module">import { montarSidebar, aplicarUsuarioLogado } from "../js/layout.js"; montarSidebar(); aplicarUsuarioLogado();</script>

</html>
