<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDV - Açaí do Rapha</title>

<link rel="stylesheet" href="../css/pdv.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>

<body>

<header class="topBar">

  <!-- ESQUERDA -->
  <div class="logoArea">
    <img src="../img/Logo.png">
    <span class="tituloPDV">PDV Açaí do Rapha</span>
  </div>

  <!-- CENTRO (CAIXA) -->
  <div class="acoesCaixa desktopOnly">
    <button onclick="abrirCaixaManual()">
      <i class="fa-solid fa-cash-register"></i> Abrir Caixa
    </button>

    <button onclick="fecharCaixaManual()">
      <i class="fa-solid fa-chart-line"></i> Fechar Caixa
    </button>

    <button onclick="retirada()">
      <i class="fa-solid fa-arrow-up"></i> Retirada
    </button>
  </div>

  <!-- DIREITA -->
  <div class="menuArea desktopOnly">

    <span id="usuarioLogado"></span>

    <div id="menuAdmin" class="menuAdmin hidden">
      <button onclick="irProdutos()">
        <i class="fa-solid fa-box"></i> Produtos
      </button>

      <button onclick="irEntregas()">
        <i class="fa-solid fa-motorcycle"></i> Entregas
      </button>

      <button onclick="irDashboard()">
        <i class="fa-solid fa-chart-pie"></i> Dashboard
      </button>

      <button onclick="irHistorico()">
        <i class="fa-solid fa-clock-rotate-left"></i> Histórico
      </button>
    </div>

    <button onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i> Sair
    </button>

  </div>

  <!-- HAMBURGUER (SÓ MOBILE) -->
  <button class="menuToggle" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </button>

</header>

<!-- MENU MOBILE -->
<div id="menuMobile" class="menuMobile">

  <span id="usuarioLogado"></span>

  <button onclick="abrirCaixaManual()">
    <i class="fa-solid fa-cash-register"></i> Abrir Caixa
  </button>

  <button onclick="fecharCaixaManual()">
    <i class="fa-solid fa-chart-line"></i> Fechar Caixa
  </button>

  <button onclick="retirada()">
    <i class="fa-solid fa-arrow-up"></i> Retirada
  </button>

  <div id="menuAdmin" class="menuAdmin hidden">
    <button onclick="irProdutos()">
      <i class="fa-solid fa-box"></i> Produtos
    </button>

    <button onclick="irEntregas()">
      <i class="fa-solid fa-motorcycle"></i> Entregas
    </button>

    <button onclick="irDashboard()">
      <i class="fa-solid fa-chart-pie"></i> Dashboard
    </button>

    <button onclick="irHistorico()">
      <i class="fa-solid fa-clock-rotate-left"></i> Histórico
    </button>
  </div>

  <button onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i> Sair
  </button>

</div>

<div id="pedidosEspera">

<h3>Pedidos em espera</h3>

<div id="listaPedidos"></div>

</div>

<div class="pdvContainer">

<div id="categorias" class="categorias"></div>

<!-- PRODUTOS -->

<div class="areaProdutos">

<div class="buscaProdutos">

<input 
type="text"
id="pesquisaProduto"
placeholder="Pesquisar produto..."
oninput="filtrarProdutos()"
/>

</div>

<div id="produtos" class="produtos"></div>

</div>

<!-- CAIXA -->

<div class="caixa">

<h2>Venda</h2>

<div id="carrinho" class="carrinho"></div>

<div class="totalBox">

<span>Total</span>

<h1 id="total">R$ 0,00</h1>

</div>

<div class="pagamentos">

<button onclick="pagarSimples('dinheiro')">
<i class="fa-solid fa-money-bill"></i> Dinheiro
</button>

<button onclick="pagarSimples('pix')">
<i class="fa-brands fa-pix"></i> PIX
</button>

<button onclick="pagarSimples('debito')">
<i class="fa-solid fa-credit-card"></i> Débito
</button>

<button onclick="pagarSimples('credito')">
<i class="fa-solid fa-credit-card"></i> Crédito
</button>

<button onclick="pagarSimples('ticket')">
<i class="fa-solid fa-ticket"></i> Ticket
</button>

<button onclick="abrirPagamentoMisto()">
<i class="fa-solid fa-layer-group"></i> Misto
</button>

<button onclick="pagarSimples('cashback')">
<i class="fa-solid fa-coins"></i> Cashback
</button>

</div>

</div>

</div>

<div class="mobileNav">
  <button onclick="trocarTela('produtos')">
    🛒 <span>Produtos</span>
  </button>

  <button onclick="trocarTela('carrinho')">
    📦 <span>Carrinho</span>
  </button>

  <button onclick="trocarTela('pagamento')">
    💳 <span>Pagamento</span>
  </button>
</div>

<button id="btnFinalizarMobile" onclick="trocarTela('pagamento')">
💳 Finalizar
<span id="badgeCarrinho">0</span>
</button>

<script type="module" src="../js/caixa.js"></script>

</body>
</html>
