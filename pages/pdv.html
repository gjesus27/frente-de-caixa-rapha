<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDV - Açaí do Rapha</title>

<link rel="stylesheet" href="../css/pdv.css">

</head>

<body>

<header class="topBar">

<div class="logoArea">

<img src="../img/Logo.png">

<span class="tituloPDV">PDV Açaí do Rapha</span>

<div class="acoesCaixa">

<button onclick="abrirCaixaManual()">Abrir Caixa</button>

<button onclick="fecharCaixaManual()">Fechar Caixa</button>

<button onclick="retirada()">Retirada</button>

</div>

</div>

<div class="menuArea">

<span id="usuarioLogado"></span>

<div id="menuAdmin" class="menuAdmin hidden">

<button onclick="irProdutos()">Produtos</button>
<button onclick="irEntregas()">Entregas</button>
<button onclick="irDashboard()">Dashboard</button>

</div>

<button onclick="logout()">Sair</button>

</div>

</header>

<div id="pedidosEspera">

<h3>Pedidos em espera</h3>

<div id="listaPedidos"></div>

</div>

<div class="pdvContainer">

<!-- PRODUTOS -->

<div class="areaProdutos">

<div class="buscaProdutos">

<input 
type="text"
id="pesquisaProduto"
placeholder="Pesquisar produto..."
oninput="filtrarProdutos()"
/>

</div>

<div id="produtos" class="produtos"></div>

</div>

<!-- CAIXA -->

<div class="caixa">

<h2>Venda</h2>

<div id="carrinho" class="carrinho"></div>

<div class="totalBox">

<span>Total</span>

<h1 id="total">R$ 0,00</h1>

</div>

<div class="pagamentos">

<button onclick="finalizar('dinheiro')">Dinheiro</button>
<button onclick="finalizar('pix')">PIX</button>
<button onclick="finalizar('debito')">Débito</button>
<button onclick="finalizar('credito')">Crédito</button>

</div>

</div>

</div>

<script type="module" src="../js/caixa.js"></script>

</body>
</html>
