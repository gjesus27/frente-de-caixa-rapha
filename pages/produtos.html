<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos</title>
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/produtos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>
<body>
<div class="layoutAdmin">
  <aside class="sidebarAdmin">
    <h2>Painel</h2>
      <p class="sidebarUser" data-usuario-logado></p>
    <nav>
      <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a href="pdv.html"><i class="fa-solid fa-cash-register"></i> PDV</a>
      <a href="caixa.html"><i class="fa-solid fa-vault"></i> Caixa</a>
      <a href="produtos.html" class="ativo"><i class="fa-solid fa-box"></i> Produtos</a>
      <a href="entregador.html"><i class="fa-solid fa-motorcycle"></i> Entregas</a>
      <a href="historico.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
    </nav>
    <a class="sidebarAction suporte" href="https://wa.me/11987293823" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i> Solicitar suporte</a>
    <button id="logout" class="sidebarAction sair">Sair</button>
  </aside>

  <main class="conteudoAdmin">
    <header class="topoProdutos">
      <div>
        <h1>Estoque</h1>
        <p>Gerencie seus produtos e quantidades mantendo o padrão do dashboard.</p>
      </div>
      <button id="abrirModal" class="btnPrimario">
        <i class="fa-solid fa-plus"></i>
        Adicionar produto
      </button>
    </header>

    <section class="toolbarProdutos">
      <div class="busca">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="buscarProduto" placeholder="Buscar por nome ou categoria">
      </div>

      <div class="filtrosStatus">
        <button class="filtroBtn ativo" data-filter="all">Todos</button>
        <button class="filtroBtn" data-filter="inStock">Em estoque</button>
        <button class="filtroBtn" data-filter="outOfStock">Esgotado</button>
      </div>
    </section>

    <section class="tabelaWrapper" id="tabelaWrapper">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Custo</th>
            <th>Quantidade</th>
            <th>Mínimo</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
      </table>
    </section>

    <section class="estadoVazio" id="estadoVazio" hidden>
      <i class="fa-solid fa-box-open"></i>
      <p>Nenhum registro encontrado.</p>
    </section>
  </main>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modalBox">
    <h3 id="tituloModal">Novo Produto</h3>

    <label>Nome</label>
    <input id="nomeProduto" placeholder="Nome do produto">

    <label>Descrição</label>
    <textarea id="descricaoProduto" rows="2" placeholder="Descrição curta do produto"></textarea>

    <label>Categoria</label>
    <input id="categoriaProduto" placeholder="Ex: Lanches">

    <div class="grid2">
      <div>
        <label>Preço (R$)</label>
        <input id="precoProduto" inputmode="decimal" placeholder="R$ 0,00">
      </div>
      <div>
        <label>Custo (R$)</label>
        <input id="custoProduto" inputmode="decimal" placeholder="R$ 0,00">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Quantidade</label>
        <input id="estoqueProduto" type="number" min="0" placeholder="0">
      </div>
      <div>
        <label>Qtd. mínima</label>
        <input id="estoqueMinimo" type="number" min="0" placeholder="0">
      </div>
    </div>

    <label>Promoção (opcional)</label>
    <input id="precoPromo" inputmode="decimal" placeholder="R$ 0,00">

    <label>Código de barras (opcional)</label>
    <input id="numeroCodigoBarras" placeholder="789...">

    <label>Imagem (opcional)</label>
    <input type="file" id="fotoProduto" accept="image/*">
    <img id="previewImagem" alt="Pré-visualização" hidden>

    <div class="modalBtns">
      <button id="salvarProduto" class="btnPrimario">Salvar</button>
      <button id="fecharModal" class="btnSecundario">Cancelar</button>
    </div>
  </div>
</div>

<script type="module" src="../js/produtos.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module">import { aplicarUsuarioLogado } from "../js/layout.js"; aplicarUsuarioLogado();</script>
</body>
</html>
