<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Produtos</title>

<link rel="stylesheet" href="../css/produtos.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="topBar">

<div class="logoArea">
<img src="../img/logo-acai.png">
<span>Açaí do Rapha</span>
</div>

<div class="menuArea">
<a href="dashboard.html"><button>Dashboard</button></a>
<a href="pdv.html"><button>PDV</button></a>
<a href="produtos.html"><button>Produtos</button></a>
<a href="entregas.html"><button>Entregas</button></a>

<span id="userName"></span>
</div>

</div>

<div class="container">

<h1>Produtos</h1>

<!-- BUSCA -->
<div class="busca">
<i class="fa-solid fa-magnifying-glass"></i>
<input id="buscarProduto" placeholder="Buscar produto...">
</div>

<button id="abrirModal">+ Novo Produto</button>

<div id="listaProdutos"></div>

</div>

<!-- MODAL -->
<div id="modal">
<div class="modalBox">

<h3 id="tituloModal">Novo Produto</h3>

<label><i class="fa-solid fa-box"></i> Nome</label>
<input id="nomeProduto">

<label><i class="fa-solid fa-layer-group"></i> Categoria</label>
<input id="categoriaProduto">

<label><i class="fa-solid fa-money-bill"></i> Preço</label>
<input id="precoProduto">

<label><i class="fa-solid fa-percent"></i> Promoção (opcional)</label>
<input id="precoPromo">

<label><i class="fa-solid fa-boxes-stacked"></i> Possui estoque?</label>
<select id="temEstoque">
<option value="sim">Sim</option>
<option value="nao">Não</option>
</select>

<input id="estoqueProduto" placeholder="Quantidade em estoque">

<label><i class="fa-solid fa-barcode"></i> Código de barras?</label>
<select id="codigoBarras">
<option value="nao">Não</option>
<option value="sim">Sim</option>
</select>

<input id="numeroCodigoBarras" placeholder="Código de barras" style="display:none;">

<input type="file" id="fotoProduto">

<img id="previewImagem" style="width:100%;margin-top:10px;display:none;border-radius:8px;">

<div class="modalBtns">
<button id="salvarProduto">Salvar</button>
<button id="fecharModal">Cancelar</button>
</div>

</div>
</div>

<script type="module" src="../js/produtos.js"></script>

</body>
</html>
