<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobrança de Fiados</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/fiados.css">
  <link rel="icon" href="https://i.ibb.co/Rkmnnmwx/favicon-3.png" type="image/png">
</head>
<body>
  <div class="layoutAdmin">
    <aside class="sidebarAdmin"></aside>

    <main class="conteudoAdmin">
      <header class="fiadosTopo">
        <h1>Cobrança de clientes fiado</h1>
        <p>Veja pendências e marque recebimentos.</p>
      </header>
      <section class="painelCard">
        <div class="fiadoFiltros">
          <input id="buscaFiado" class="fiadoBusca" placeholder="Buscar por cliente ou WhatsApp">
          <select id="filtroStatusFiado" class="fiadoFiltroStatus" aria-label="Filtrar por status">
            <option value="aberto">Em aberto</option>
            <option value="pago">Pago</option>
            <option value="todos">Todos</option>
          </select>
        </div>
        <div id="listaFiados" class="listaFiados"></div>
      </section>
    </main>
  </div>
  <script type="module">import { exigirLogin, montarSidebar, aplicarUsuarioLogado } from "../js/layout.js"; exigirLogin(); montarSidebar(); aplicarUsuarioLogado();</script>
  <script type="module" src="../js/fiados.js"></script>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
